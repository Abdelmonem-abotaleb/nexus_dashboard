name: nexus_dashboard
description: A sleek, customizable Windows login screen and dashboard.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP & Weather
  http: ^1.1.0

  # Storage / persistence
  shared_preferences: ^2.2.2

  # URL launcher (open websites)
  url_launcher: ^6.2.2

  # File picker (for background image)
  file_picker: ^11.0.2

  # Window management
  window_manager: ^0.5.1

  # Intl for date formatting
  intl: ^0.20.2
  system_tray: 2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
